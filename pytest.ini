[pytest]
# Restrict collection to the tests/ package and never descend into the vendored
# upstream dojo kernel (vendor/openmle_dojo) -- it is a reference copy, not part of
# this project's test surface, and contains no project tests.
testpaths = tests
norecursedirs = vendor .git __pycache__ node_modules .pytest_cache
addopts = -p no:cacheprovider
